services:
  engine:
    build: .
    image: infinityproxy-engine
    network_mode: host
    environment:
      # Every knob `Settings.from_env` reads is forwarded explicitly: .env only
      # feeds ${...} interpolation, it does not inject variables into the
      # container on its own.
      INFINITY_HOST: ${INFINITY_HOST:-127.0.0.1}
      INFINITY_PORT: ${INFINITY_PORT:-8787}
      INFINITY_PANEL_HOST: ${INFINITY_PANEL_HOST:-127.0.0.1}
      INFINITY_PANEL_PORT: ${INFINITY_PANEL_PORT:-8000}
      INFINITY_ENGINE_URL: ${INFINITY_ENGINE_URL:-http://127.0.0.1:8787}
      INFINITY_TUNNEL_RANGE: ${INFINITY_TUNNEL_RANGE:-10000-59999}
      # Empty defaults: a value here would always win over INFINITY_TUNNEL_RANGE.
      INFINITY_TUNNEL_RANGE_START: ${INFINITY_TUNNEL_RANGE_START:-}
      INFINITY_TUNNEL_RANGE_END: ${INFINITY_TUNNEL_RANGE_END:-}
      INFINITY_BATCH_SIZE: ${INFINITY_BATCH_SIZE:-50}
      INFINITY_PROBE_TIMEOUT_MS: ${INFINITY_PROBE_TIMEOUT_MS:-4000}
      INFINITY_PROBE_BUDGET_PER_REFRESH: ${INFINITY_PROBE_BUDGET_PER_REFRESH:-5000}
      INFINITY_HEALTH_INTERVAL_S: ${INFINITY_HEALTH_INTERVAL_S:-30}
      INFINITY_URTEST_INTERVAL_S: ${INFINITY_URTEST_INTERVAL_S:-30}
      INFINITY_MAX_MISSES: ${INFINITY_MAX_MISSES:-2}
      INFINITY_THROUGHPUT_ENABLED: ${INFINITY_THROUGHPUT_ENABLED:-1}
      INFINITY_THROUGHPUT_MIN_KB_S: ${INFINITY_THROUGHPUT_MIN_KB_S:-200}
      INFINITY_THROUGHPUT_SAMPLE_BYTES: ${INFINITY_THROUGHPUT_SAMPLE_BYTES:-1048576}
      INFINITY_THROUGHPUT_TIMEOUT_S: ${INFINITY_THROUGHPUT_TIMEOUT_S:-12.0}
      INFINITY_THROUGHPUT_HOST: ${INFINITY_THROUGHPUT_HOST:-speed.cloudflare.com}
      INFINITY_THROUGHPUT_PORT: ${INFINITY_THROUGHPUT_PORT:-80}
      INFINITY_THROUGHPUT_PATH: ${INFINITY_THROUGHPUT_PATH:-/__down?bytes=10485760}
      INFINITY_STABILITY_ENABLED: ${INFINITY_STABILITY_ENABLED:-1}
      INFINITY_STABILITY_MIN_PROBES: ${INFINITY_STABILITY_MIN_PROBES:-6}
      INFINITY_STABILITY_MIN_AVAIL: ${INFINITY_STABILITY_MIN_AVAIL:-0.4}
      INFINITY_STABILITY_WEIGHT_AVAIL: ${INFINITY_STABILITY_WEIGHT_AVAIL:-0.6}
      INFINITY_STABILITY_WEIGHT_SPEED: ${INFINITY_STABILITY_WEIGHT_SPEED:-0.4}
      INFINITY_STABILITY_WINDOW_S: ${INFINITY_STABILITY_WINDOW_S:-3600}
      INFINITY_STABILITY_MAX_AGE_S: ${INFINITY_STABILITY_MAX_AGE_S:-21600}
      INFINITY_STABILITY_WORKING_SET: ${INFINITY_STABILITY_WORKING_SET:-256}
      INFINITY_STABILITY_WORKING_SET_CADENCE_S: ${INFINITY_STABILITY_WORKING_SET_CADENCE_S:-300}
      INFINITY_STABILITY_REPROBE_MIN_S: ${INFINITY_STABILITY_REPROBE_MIN_S:-120}
      INFINITY_HOST_PICK_TTL_S: ${INFINITY_HOST_PICK_TTL_S:-60}
      INFINITY_HOST_PICK_TEST_URL: ${INFINITY_HOST_PICK_TEST_URL:-https://api.ipify.org}
      INFINITY_HOST_PICK_SAMPLE_BYTES: ${INFINITY_HOST_PICK_SAMPLE_BYTES:-262144}
      INFINITY_HOST_PICK_TIMEOUT_S: ${INFINITY_HOST_PICK_TIMEOUT_S:-8.0}
      INFINITY_DB: /data/infinity.db
      INFINITY_SINGBOX_IMAGE: ${INFINITY_SINGBOX_IMAGE:-ghcr.io/sagernet/sing-box:v1.11.6}
      INFINITY_ENGINE_NAME_PREFIX: ${INFINITY_ENGINE_NAME_PREFIX:-infinity}
      INFINITY_PANEL_BASE_URL: ${INFINITY_PANEL_BASE_URL:-http://127.0.0.1:${INFINITY_PANEL_PORT:-8000}}
      INFINITY_HOST_ENABLED: ${INFINITY_HOST_ENABLED:-0}
      INFINITY_HOSTAGENT_URL: ${INFINITY_HOSTAGENT_URL:-http://127.0.0.1:8788}
      INFINITY_HOSTAGENT_PORT: ${INFINITY_HOSTAGENT_PORT:-8788}
    volumes:
      - infinity-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  panel:
    build: .
    image: infinityproxy-engine
    network_mode: host
    command: ["python", "-m", "panel"]
    environment:
      INFINITY_PANEL_HOST: ${INFINITY_PANEL_HOST:-127.0.0.1}
      INFINITY_PANEL_PORT: ${INFINITY_PANEL_PORT:-8000}
      INFINITY_ENGINE_URL: ${INFINITY_ENGINE_URL:-http://127.0.0.1:8787}
      INFINITY_PANEL_TEST_URL: ${INFINITY_PANEL_TEST_URL:-https://api.ipify.org}
    depends_on:
      - engine
    restart: unless-stopped

  hostagent:
    build: .
    image: infinityproxy-engine
    network_mode: host
    privileged: true
    profiles: ["host"]
    command: ["python", "-m", "hostagent"]
    environment:
      INFINITY_HOSTAGENT_HOST: 127.0.0.1
      INFINITY_HOSTAGENT_PORT: ${INFINITY_HOSTAGENT_PORT:-8788}
      INFINITY_HOST_UID: ${INFINITY_HOST_UID:-1000}
      INFINITY_HOST_BUS: ${INFINITY_HOST_BUS:-/run/user/${INFINITY_HOST_UID:-1000}/bus}
      INFINITY_SINGBOX_IMAGE: ${INFINITY_SINGBOX_IMAGE:-ghcr.io/sagernet/sing-box:v1.11.6}
      INFINITY_ENGINE_NAME_PREFIX: ${INFINITY_ENGINE_NAME_PREFIX:-infinity}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/user/${INFINITY_HOST_UID:-1000}/bus:/run/user/${INFINITY_HOST_UID:-1000}/bus
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped

  tenancy:
    build: .
    image: infinityproxy-engine
    network_mode: host
    command: ["python", "-m", "tenancy"]
    profiles: ["tenancy"]
    environment:
      INFINITY_TENANCY_HOST: ${INFINITY_TENANCY_HOST:-127.0.0.1}
      INFINITY_TENANCY_PORT: ${INFINITY_TENANCY_PORT:-8790}
      INFINITY_TENANCY_ENGINE_URL: ${INFINITY_TENANCY_ENGINE_URL:-http://127.0.0.1:8787}
      INFINITY_TENANCY_DB: /data/tenancy.db
      INFINITY_TENANCY_ADMIN_KEY: ${INFINITY_TENANCY_ADMIN_KEY:-}
      INFINITY_TENANCY_TUNNEL_HOST: ${INFINITY_TENANCY_TUNNEL_HOST:-}
      INFINITY_TENANCY_STARTING_CREDITS: ${INFINITY_TENANCY_STARTING_CREDITS:-720}
      INFINITY_TENANCY_MAX_TENANTS: ${INFINITY_TENANCY_MAX_TENANTS:-50}
      INFINITY_TENANCY_MAX_TUNNELS: ${INFINITY_TENANCY_MAX_TUNNELS:-4}
      INFINITY_TENANCY_MAX_NODES: ${INFINITY_TENANCY_MAX_NODES:-20}
      INFINITY_TENANCY_CREDIT_INTERVAL_S: ${INFINITY_TENANCY_CREDIT_INTERVAL_S:-3600}
      INFINITY_TENANCY_METER_ENABLED: ${INFINITY_TENANCY_METER_ENABLED:-1}
    volumes:
      - infinity-data:/data
    depends_on:
      - engine
    restart: unless-stopped

volumes:
  infinity-data: