name: build-push

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push engine
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # GHCR registry paths must be lowercase; github.repository keeps the
          # repo's original casing (InfinityProxy), so pin the lowercase path.
          tags: |
            ghcr.io/m1778/infinityproxy:engine-${{ github.ref_name }}
            ghcr.io/m1778/infinityproxy:engine-latest
      - name: Build and push tunnel image
        uses: docker/build-push-action@v6
        with:
          context: ./tunnel-image
          push: true
          tags: |
            ghcr.io/m1778/infinityproxy:tunnel-${{ github.ref_name }}
            ghcr.io/m1778/infinityproxy:tunnel-latest