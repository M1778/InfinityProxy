name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run frontend regressions
        run: node --test tests/panel_frontend.test.cjs