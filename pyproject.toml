[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infinityproxy"
version = "0.1.0"
description = "Universal 3D rotating proxy: free node scrape + filter + per-tunnel sing-box rotation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cryptography>=42.0",
    "docker>=7.0",
    "flask>=3.0",
    "markdown>=3.5",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["engine*", "panel*", "hostagent*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"