<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="InfinityProxy control panel — relay-ops console">
<title>InfinityProxy panel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='7' width='18' height='18' rx='4' fill='none' stroke='%2363E6A0' stroke-width='2.5'/%3E%3Cpath d='M14 16h4M16 14v4M4 16h3M25 16h3' stroke='%2363E6A0' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#overview">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="8" y="8" width="8" height="8" rx="1.5"/>
      <path d="M11 12h2" opacity=".9"/>
      <path d="M3 12h3M18 12h3" opacity=".55"/>
    </svg>
    InfinityProxy<span class="brand-sub">panel</span>
  </a>
  <nav class="tabs">
    <a href="#overview" data-view="overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M3.5 9.5h17M9.5 3.5v17"/>
      </svg>
      <span class="tablabel">Overview</span>
    </a>
    <a href="#tunnels" data-view="tunnels">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="5" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/><path d="M7.3 12h9.4"/>
      </svg>
      <span class="tablabel">Tunnels</span>
    </a>
    <a href="#nodes" data-view="nodes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3l8 4.5-8 4.5-8-4.5z"/><path d="M4 12l8 4.5 8-4.5"/><path d="M4 16.5L12 21l8-4.5"/>
      </svg>
      <span class="tablabel">Nodes</span>
    </a>
    <a href="#sources" data-view="sources">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M4 4a16 16 0 0 1 16 16"/><path d="M4 10a10 10 0 0 1 10 10"/><circle cx="5.5" cy="18.5" r="1.4"/>
      </svg>
      <span class="tablabel">Sources</span>
    </a>
  </nav>
  <div id="conn-pill" class="pill" data-state="offline"><span class="dot"></span><span class="plabel">connecting</span></div>
</header>

<main>
  <section id="view-overview" class="view" data-name="overview">
    <div class="cards" id="stat-cards"></div>
    <div class="charts">
      <div class="chart-card wide"><h2><svg class="hicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h3l2-6 4 12 3-9 1.5 3H21"/></svg>Pool over 2h</h2><canvas id="pool-chart"></canvas></div>
      <div class="chart-card"><h2><svg class="hicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/><path d="M7.3 12h9.4"/></svg>Tunnels over 2h</h2><canvas id="tunnel-chart"></canvas></div>
      <div class="chart-card"><h2><svg class="hicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 12l6.8-4.6M12 12V3.5"/></svg>Pool split now</h2>
        <div class="donut-wrap">
          <canvas id="donut-chart"></canvas>
          <div class="donut-center">
            <span class="donut-total" id="donut-total">&ndash;</span>
            <span class="donut-label" id="donut-inuse"></span>
          </div>
        </div>
      </div>
      <div class="chart-card wide"><h2><svg class="hicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20V9M10 20V4M16 20v-8M22 20v-5"/></svg>Pool by protocol</h2><canvas id="proto-chart"></canvas></div>
    </div>
  </section>

  <section id="view-tunnels" class="view" data-name="tunnels" hidden>
    <div class="toolbar">
      <form id="create-form" class="inline-form">
        <label>Nodes <input id="create-count" type="number" min="1" max="200" step="1" value="10"></label>
        <label class="check"><input id="create-renew" type="checkbox" checked> auto-renew</label>
        <button type="submit" class="btn primary">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
          Create tunnel
        </button>
      </form>
    </div>
    <div class="table-wrap">
      <table class="data-table" id="tunnel-table">
        <thead><tr>
          <th>id</th><th>endpoint</th><th>granted</th><th>tier mix</th><th>state</th><th>health</th><th>actions</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section id="view-nodes" class="view" data-name="nodes" hidden>
    <div class="toolbar">
      <form id="node-filter" class="inline-form">
        <label>state <select id="f-state"><option value="">any</option><option>untested</option><option>alive</option><option>dead</option></select></label>
        <label>protocol <select id="f-protocol"><option value="">any</option></select></label>
        <label>source <select id="f-source"><option value="">any</option></select></label>
        <label><input id="f-inuse" type="checkbox"> in use</label>
        <label>search <input id="f-q" type="search" placeholder="server / id"></label>
        <label>limit <input id="f-limit" type="number" min="1" max="1000" step="1" value="200"></label>
        <button type="submit" class="btn primary">Load</button>
      </form>
    </div>
    <p class="muted" id="node-count"></p>
    <div class="table-wrap">
      <table class="data-table" id="node-table">
        <thead><tr>
          <th>id</th><th>protocol</th><th>server</th><th>source</th><th>state</th><th>latency</th><th>throughput</th><th>in use</th><th>avail</th><th>score</th><th>tier</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section id="view-sources" class="view" data-name="sources" hidden>
    <div class="table-wrap">
      <table class="data-table" id="source-table">
        <thead><tr>
          <th>name</th><th>last fetch</th><th>next fetch</th><th>actions</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<footer id="footer" class="muted"></footer>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <h3 id="modal-title">Details</h3>
    <div id="modal-body" class="modal-body"></div>
    <button class="btn" id="modal-close">Close</button>
  </div>
</div>
<div id="toasts" class="toasts"></div>

<script src="vendor/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
